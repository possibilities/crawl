# Copy to site.yml in an empty working directory, then set your own authorized URL.
startUrl: https://example.com/
# startUrl is always a literal URL-prefix include. Add globs to expand scope.
# Empty include stays under that prefix. Deny rules win.
# Use a trailing slash for a directory boundary (e.g. https://example.com/docs/).
include: []
exclude:
  - /logout
  - /signout
# Bare hostnames deny that hostname and all its subdomains, at every port.
denyDomains: []
maxConcurrency: 3
maxRetries: 2
maxPagesPerRun: 1000
maxRequestsPerMinute: 120
# Optional. Establish this state yourself using `crawl login` on your local machine.
# Authenticated pages can only request their own exact origin (including resources).
# auth:
#   origins:
#     - https://example.com
